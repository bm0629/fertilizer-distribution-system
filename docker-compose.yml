version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: fds_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fds_db
    ports:
      - "3306:3306"
    volumes:
      - fds_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fds_backend
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fds_db
      DB_USERNAME: root
      DB_PASSWORD: root
      QR_HMAC_SECRET: fds_super_secret_hmac_signing_key_2026_gov_subsidy
      QR_TTL_MINUTES: 15
      PAYMENT_GATEWAY_SECRET: whsec_paygateway_live_secret_2026
      SUBSIDY_HIGH_NITROGEN_MAX_BAGS: 5
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fds_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  fds_mysql_data:
